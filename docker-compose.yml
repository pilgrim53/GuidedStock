services:
  redis:
    image: 'redis:alpine'
    
  db:
    image: postgres
    volumes: 
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports: 
      - "5432:5432"
  web:
    restart: always
    build: .
    volumes:
      - .:/code
      - static:/static
      - media:/media
    env_file:
      - .env
    depends_on:
      - db
  nginx:
    build: ./nginx
    volumes:
      - static:/static
      - media:/media
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - redis
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      
volumes:
  pgdata:
  static:
  media:
