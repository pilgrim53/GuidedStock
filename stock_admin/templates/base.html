{% load static %}
<html>

<head>
    <meta charset="uft-8">
    <title>{% block title %}GuidedStock | Personal Stock Portfolio Management Tools{% endblock %}</title>
    <link rel="icon" href="{% static 'assets/logos/favicon.png' %}" type="image/png" sizes="16x16">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GuidedStock Personal Stock Portfolio Management Tools">
    <meta name="keywords" content="stocks, trading, management, portfolio, management">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,300,500,700,600" rel="stylesheet" type="text/css">
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet" type="text/css" media="all" />
</head>

<body class="{% block body_class %}{% endblock %}">
    {% block body %}
    {% block content %}
    {% endblock %}
    <!-- Footer Section -->
    <div class="footer no-color">
        <div class="container">
            <div class="col-md-12 text-center">
                <img class="img-circle" src="{% static 'assets/logos/logo.png' %}" width="40" height="40"
                    alt="GuidedStock abbreviated logo">
                <div class="footer-text">
                    <p>
                        &copy;2021 GuidedStock. All Rights Reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}

    <script type="text/javascript" src="{% static 'assets/js/jquery.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/bootstrap.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/custom.js' %}"></script>
    {% block js %}
    {% endblock %}
</body>

</html>
