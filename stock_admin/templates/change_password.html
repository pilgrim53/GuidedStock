{% extends 'base.html' %}

{% load crispy_forms_tags i18n %}

{% block content %}

<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save changes</button>
    <a href="{% url 'portfolio' %}" class="btn btn-danger">Cancel</a>
</form>

{% endblock %}
