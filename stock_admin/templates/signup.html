{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block content %}
<h2>Sign up</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="checkbox" id="agree" />
    <label for="agree">
        I agree with the <a href="{% url 'terms-and-conditions' %}">terms and conditions</a>
    </label>
    <input type="submit" value='Sign Up' />
</form>
{% endblock %}
