{% extends 'base.html' %}

{% block title %}{{ object.stock_name }} ({{ object.ticker }}){% endblock %}

{% block content %}
<h1> Delete {{ object.stock_name }} ({{ object.ticker }})</h1>
<form method="POST">
    {% csrf_token %}
    <p>Are you sure you want to delete {{ object.stock_name }} ({{ object.ticker }})?</p>
    <input type="submit" class="btn btn-danger" value="Confirm Delete">
    <a href="{% url 'portfolio' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
