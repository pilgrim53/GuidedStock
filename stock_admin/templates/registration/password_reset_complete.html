{% extends "base.html" %}

{% load i18n static %}
{% block title %}Change Password Done{% endblock %}

{% block content %}

<body class="{% block body_class %}login-page-outside-style{% endblock %}">

    <div class="outside-wrapper">
        <div class="custom-col">
            <div class="header-logo">
                <a href="{% url 'home' %}"> <img src="{% static 'assets/logos/gs_logo.png' %}" alt="footer-logo" /></a>
            </div>
            <div class="login-form sucess-msg">
                <h2 class="text-center text-success">Success</h2>

                <p>
                    Your password has been set. You may go ahead and log in now.
                </p>
                <div class="form-group text-center">
                    <a href="{% url 'login' %}" type="submit" class="custom-btn back-login">Back in Login</a>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
