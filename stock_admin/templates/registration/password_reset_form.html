{% extends "base.html" %}
{% load i18n crispy_forms_tags%}
{% block content %}
<h4 class="text-center">{% trans 'Reset Password' %}</h4>
<div>
    {% blocktrans %}Enter your <b>Email</b> and instructions will be sent to you!{% endblocktrans %}
</div>
<form action="" method="post">
    {% csrf_token %}
    {{form|crispy}}
    <button type="submit">{% trans 'Reset Password' %}</button>
</form>
{% endblock %}
