{% extends "base.html" %}

{% load i18n crispy_forms_tags%}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="h3 mb-3 font-weight-normal">{% trans 'Reset Password' %}</h1>
                    <p>
                        {% blocktrans %}Enter your <b>Email</b> and instructions will be sent to you!{% endblocktrans %}
                    </p>
                    <form action="" method="post">
                        {% csrf_token %}
                        {{form|crispy}}
                        <input type="submit" class="btn btn-lg btn-primary btn-block" value='Reset Password' />
                        <div class="m-2">
                            <a href="{% url 'login' %}" class="text-muted">Do you want to SignIn?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
