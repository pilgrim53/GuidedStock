{% extends "base.html" %}
{% load i18n static %}

{% block header %}{% endblock %}

{% block title %}Success{% endblock %}

{% block body_class %}login-page-outside-style{% endblock %}

{% block content %}
<div class="outside-wrapper">
    <div class="custom-col">
        <div class="header-logo">
            <a href="{% url 'portfolio' %}"> <img src="{% static 'assets/logos/gs_logo.png' %}" alt="footer-logo" /></a>
        </div>
        <div class="login-form sucess-msg">
            <h2 class="text-center text-success">Success</h2>
            <p>
                Your password Successfully Changed.
            </p>

            <div class="form-group text-center">
                <a href="{% url 'portfolio' %}" type="submit" class="custom-btn back-login">Back to Portfolio</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
