upstream guidedstock.com {
    server web:8000;
}

server {
    listen 80;
    server_name guidedstock.com;    
    
    location / {
        return 301 https://$host$request_uri;
    }     

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name guidedstock.com;

    ssl_certificate /etc/letsencrypt/live/guidedstock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guidedstock.com/privkey.pem;

    location / {
        proxy_pass http://guidedstock.com;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }
}
