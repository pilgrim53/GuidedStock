upstream 127.0.0.1 {
    server web:8000;
}

server {
    listen 80;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300; 

    location / {
        proxy_pass http://127.0.0.1 ;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }
}
